services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agendasaas
      POSTGRES_PASSWORD: agendasaas
      POSTGRES_DB: agendasaas
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agendasaas"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://agendasaas:agendasaas@postgres:5432/agendasaas
      MEDIA_STORAGE_ROOT: /app/uploads
    ports:
      - "3000:3000"
    volumes:
      # Without this, the local-disk FileStoragePort adapter writes into the container's
      # writable layer and every uploaded logo/photo is lost on the next `docker compose up`.
      - media-uploads:/app/uploads
    profiles: ["full"]

volumes:
  pgdata:
  media-uploads:
