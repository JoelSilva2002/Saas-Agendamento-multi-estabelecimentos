services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agendasaas
      POSTGRES_PASSWORD: agendasaas
      POSTGRES_DB: agendasaas
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agendasaas"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://agendasaas:agendasaas@postgres:5432/agendasaas
    ports:
      - "3000:3000"
    profiles: ["full"]

volumes:
  pgdata:
